<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зажигаем гирлянду 2027</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:radial-gradient(circle at top,#1b2845 0%,#090d16 100%);color:#f8f9fa;min-height:100vh;padding:20px;overflow-x:hidden}
.container{max-width:1000px;margin:0 auto;text-align:center;position:relative;z-index:2}
h1{font-size:2.2rem;margin-bottom:5px;color:#ffd166;text-shadow:0 0 15px rgba(255,209,102,.4)}
.subtitle{color:#a9bcd0;margin-bottom:30px;font-size:1.1rem}

.tree-section{background:rgba(28,37,65,.6);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:30px 20px;margin-bottom:30px;box-shadow:0 10px 30px rgba(0,0,0,.4);position:relative;overflow:hidden}
.tree-scene-wrap{width:100%;max-width:680px;margin:0 auto;position:relative}
.tree-scene{position:relative;width:100%;padding-bottom:131.25%}
.tree-scene-inner{position:absolute;top:0;left:0;right:0;bottom:0}

.bg-garland{position:absolute;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;overflow:visible}
.tree-svg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}

/* Огоньки */
.mini-bulb{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);transition:transform 0.3s,opacity 0.3s,background-color 0.5s;cursor:pointer;z-index:0;pointer-events:auto}
.mini-bulb.dimmed{opacity:.08!important;animation:none!important}
.mini-bulb.highlighted{transform:translate(-50%,-50%) scale(1.8);z-index:3}

.tree-bulb{position:absolute;border-radius:50%;transform:translate(-50%,-50%);transition:transform 0.3s,box-shadow 0.3s,background-color 0.5s;cursor:pointer;z-index:2;animation:twinkle 2.5s infinite alternate}
.tree-bulb.dimmed{opacity:.25!important;animation:none}
.tree-bulb.highlighted{transform:translate(-50%,-50%) scale(1.35);z-index:5}
@keyframes twinkle{0%{opacity:.85;filter:brightness(1)}100%{opacity:1;filter:brightness(1.5)}}

/* Анимация перемешивания для гирлянды */
@keyframes shuffleColors {
  0% { filter: hue-rotate(0deg); transform: translate(-50%, -50%) scale(1); }
  50% { filter: hue-rotate(180deg); transform: translate(-50%, -50%) scale(1.5); }
  100% { filter: hue-rotate(360deg); transform: translate(-50%, -50%) scale(1); }
}
@keyframes moveAround {
  0% { margin-left: 0; margin-top: 0; }
  25% { margin-left: 5px; margin-top: -5px; }
  50% { margin-left: -5px; margin-top: 5px; }
  75% { margin-left: 5px; margin-top: 5px; }
  100% { margin-left: 0; margin-top: 0; }
}
.new-year-mode .mini-bulb {
  animation: shuffleColors 0.3s infinite alternate, moveAround 0.4s infinite;
  box-shadow: 0 0 15px #fff, 0 0 30px currentColor !important;
}
.new-year-mode .tree-bulb {
  animation: shuffleColors 0.3s infinite alternate;
  box-shadow: 0 0 20px #fff !important;
}

/* Исправленный блок статистики */
.stats-bar{display:flex;justify-content:center;gap:20px;margin-top:25px;flex-wrap:wrap}
.stat-box{
  flex:1 1 160px; max-width:220px; background:rgba(11,19,43,.7);
  padding:15px 10px; border-radius:12px; border:1px solid rgba(255,209,102,.3);
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:4px;
}
.stat-number{font-size:1.8rem;font-weight:bold;color:#ffd166;line-height:1.1}
.stat-label{font-size:0.9rem;color:#a9bcd0;line-height:1.2}

.filter-hint{margin-top:20px;font-size:.9rem;color:#a9bcd0}
.reset-btn{display:none;margin:12px auto 0;background:#ffd166;color:#0b132b;border:none;padding:8px 18px;border-radius:20px;font-weight:bold;cursor:pointer;font-size:.9rem}

.section-title{font-size:1.6rem;margin:40px 0 20px;color:#fff}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;text-align:left}
.member-card{background:#1c2541;border-radius:16px;padding:20px;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:12px;transition:transform .2s;cursor:pointer}
.member-card:hover{transform:translateY(-4px)}
.member-card.active{outline:2px solid #ffd166;background:#243154}
.member-header{display:flex;align-items:center;gap:15px}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff;flex-shrink:0;background:#2b3a67;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:bold}
.member-info h3{margin:0 0 4px 0;font-size:1.15rem}
.habit-tag{font-size:.85rem;color:#a9bcd0;display:block}
.bulb-counter{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);padding:6px 12px;border-radius:20px;font-weight:bold;font-size:.95rem;width:fit-content}
.color-dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.wish-box{background:rgba(255,255,255,.05);padding:12px;border-radius:10px;font-size:.92rem;line-height:1.4;color:#e0e6ed;font-style:italic;margin-top:auto}
#loading{color:#ffd166;font-size:1.1rem;margin:20px 0}
#last-update{font-size:.8rem;color:#a9bcd0;margin-top:10px}

/* Кнопка Нового года */
.ny-btn-container{text-align:center;margin:50px 0 20px}
.ny-btn{
  background:linear-gradient(45deg, #ffd166, #ff9f1c);
  color:#0b132b; border:none; padding:15px 30px; font-size:1.2rem;
  font-weight:bold; border-radius:30px; cursor:pointer;
  box-shadow:0 0 20px rgba(255,209,102,0.5);
  transition:transform 0.2s, box-shadow 0.2s;
  display:inline-flex; align-items:center; gap:10px;
}
.ny-btn:hover{transform:scale(1.05); box-shadow:0 0 30px rgba(255,209,102,0.8)}
.ny-btn:active{transform:scale(0.95)}

/* Шампанское */
.champagne-container {
  position: absolute; bottom: 0; left: 50%;
  transform: translateX(-50%) translateY(100%);
  z-index: 10; transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex; flex-direction: column; align-items: center;
}
.new-year-mode .champagne-container { transform: translateX(-50%) translateY(0); }
.bottle-body {
  width: 40px; height: 120px; background: #1b4332;
  border-radius: 10px 10px 5px 5px; border: 2px solid #40916c;
  position: relative;
}
.bottle-neck {
  width: 16px; height: 50px; background: #1b4332;
  border: 2px solid #40916c; border-bottom: none;
  position: absolute; top: -50px; left: 12px;
  border-radius: 5px 5px 0 0;
}
.cork {
  width: 14px; height: 20px; background: #d4a373;
  border-radius: 3px; position: absolute; top: -60px; left: 13px;
  transition: transform 0.5s;
}
.new-year-mode .cork {
  transform: translateY(-100px) rotate(45deg);
}

/* Пена и частицы */
.foam-particle {
  position: absolute; width: 8px; height: 8px;
  background: rgba(255, 255, 255, 0.8); border-radius: 50%;
  pointer-events: none; z-index: 15;
}

/* Салюты */
.firework {
  position: absolute; width: 4px; height: 4px;
  border-radius: 50%; pointer-events: none; z-index: 20;
}
</style>
</head>
<body>
<div class="container">
<h1>🎄 Зажигаем гирлянду 2027</h1>
<p class="subtitle">Новогодний марафон полезных привычек • 1 – 27 декабря 2026</p>
<div id="loading">✨ Зажигаем огоньки...</div>

<div class="tree-section">
  <div class="tree-scene-wrap">
    <div class="tree-scene" id="tree-scene">
      <div class="tree-scene-inner" id="tree-scene-inner">
        <div class="bg-garland" id="bg-garland"></div>
        <svg class="tree-svg" viewBox="0 0 300 380" preserveAspectRatio="xMidYMid meet">
          <rect x="132" y="330" width="36" height="40" rx="4" fill="#5c4033"/>
          <polygon points="150,30 60,150 240,150" fill="#1b4332"/>
          <polygon points="150,95 40,240 260,240" fill="#2d6a4f"/>
          <polygon points="150,170 20,335 280,335" fill="#40916c"/>
          <polygon points="150,5 156,22 174,22 160,33 165,50 150,40 135,50 140,33 126,22 144,22" fill="#ffd166"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="stats-bar">
    <div class="stat-box">
      <div class="stat-number" id="total-bulbs">0</div>
      <div class="stat-label">Огоньков зажжено</div>
    </div>
    <div class="stat-box">
      <div class="stat-number" id="team-count">0</div>
      <div class="stat-label">Хранителей энергии</div>
    </div>
  </div>
  <div class="filter-hint">💡 Нажмите на карточку участника — вспыхнут его огоньки на фоне и его лампочка на ёлке</div>
  <button class="reset-btn" id="reset-filter">Показать все огоньки</button>
  <div id="last-update"></div>

  <div class="champagne-container" id="champagne">
     <div class="bottle-body">
        <div class="bottle-neck">
           <div class="cork"></div>
        </div>
     </div>
  </div>
</div>

<h2 class="section-title">✨ Наша команда и пожелания на 2027 год</h2>
<div class="team-grid" id="team-grid"></div>

<div class="ny-btn-container">
  <button class="ny-btn" id="ny-btn">🎆 Включить Новый Год! 🍾</button>
</div>
</div>

<script>
// ... (Весь скрипт загрузки, CSV, draw и т.д. остается без изменений, вставьте его сюда из прошлого сообщения) ...
// Вставляю для полноты картины, чтобы вы могли просто скопировать файл.

var SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTfp0jmMKiuE_XFKHdUrxG1N7USmCxr4B5B7nAFdAHF7H0FK6K-mixB0tr59PvaSrJ2q8oAH9KhwxsF/pub?gid=6257065&single=true&output=csv";
var CACHE_KEY = "garland_data_v1";

function parseCSV(text) {
  var rows = [], row = [], cell = "", inQuotes = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text.charAt(i);
    if (inQuotes) {
      if (ch === '"') {
        if (text.charAt(i + 1) === '"') { cell += '"'; i++; }
        else { inQuotes = false; }
      } else { cell += ch; }
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(cell.trim()); cell = ""; }
      else if (ch === '\n') { row.push(cell.trim()); rows.push(row); row = []; cell = ""; }
      else if (ch !== '\r') cell += ch;
    }
  }
  if (cell.length > 0 || row.length > 0) { row.push(cell.trim()); rows.push(row); }
  return rows;
}

async function fetchSheetText() {
  var enc = encodeURIComponent(SHEET_URL);
  var sources = [ SHEET_URL, "https://api.allorigins.win/raw?url=" + enc, "https://api.codetabs.com/v1/proxy?quest=" + enc ];
  function tryFetch(url) {
    return new Promise(function(resolve, reject) {
      var ctrl = new AbortController();
      var timer = setTimeout(function(){ ctrl.abort(); }, 10000);
      fetch(url, { signal: ctrl.signal, cache: "no-store", mode: "cors" })
        .then(res => { clearTimeout(timer); if (!res.ok) throw new Error(); return res.text(); })
        .then(txt => { txt = txt.replace(/^\uFEFF/, ""); if (txt.indexOf("Имя") === -1) throw new Error(); resolve(txt); })
        .catch(e => { clearTimeout(timer); reject(e); });
    });
  }
  return new Promise((resolve, reject) => {
    let done = false, errors = 0;
    sources.forEach(url => {
      tryFetch(url).then(txt => { if (!done) { done = true; resolve(txt); } })
      .catch(() => { errors++; if (errors === sources.length && !done) reject(new Error("Fail")); });
    });
  });
}

function saveCache(data) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch(e) {} }
function loadCache() { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch(e) { return null; } }

function highlightMember(name, el) {
  document.querySelectorAll(".member-card").forEach(c => c.classList.remove("active"));
  if (el) el.classList.add("active");
  document.querySelectorAll(".mini-bulb").forEach(b => {
    if (b.dataset.owner === name) { b.classList.remove("dimmed"); b.classList.add("highlighted"); }
    else { b.classList.add("dimmed"); b.classList.remove("highlighted"); }
  });
  document.querySelectorAll(".tree-bulb").forEach(b => {
    if (b.dataset.owner === name) { b.classList.remove("dimmed"); b.classList.add("highlighted"); }
    else { b.classList.add("dimmed"); b.classList.remove("highlighted"); }
  });
  document.getElementById("reset-filter").style.display = "inline-block";
}
function resetHighlight() {
  document.querySelectorAll(".member-card").forEach(c => c.classList.remove("active"));
  document.querySelectorAll(".mini-bulb, .tree-bulb").forEach(b => b.classList.remove("dimmed","highlighted"));
  document.getElementById("reset-filter").style.display = "none";
}

function draw(data) {
  var sceneInner = document.getElementById("tree-scene-inner");
  var bg = document.getElementById("bg-garland");
  var grid = document.getElementById("team-grid");
  bg.innerHTML = ""; sceneInner.querySelectorAll(".tree-bulb").forEach(n => n.remove()); grid.innerHTML = ""; resetHighlight();
  document.getElementById("team-count").innerText = data.length;
  let totalBulbs = 0; data.forEach(m => totalBulbs += m.bulbs); document.getElementById("total-bulbs").innerText = totalBulbs;

  let allBulbs = [];
  data.forEach(m => { for (let i = 0; i < m.bulbs; i++) allBulbs.push({ name: m.name, color: m.color }); });
  allBulbs.sort(() => Math.random() - 0.5);

  let H_WIRES = 20, PADDING = 2, SAG = 2.0;
  let svgNS = "http://www.w3.org/2000/svg";
  let wireSvg = document.createElementNS(svgNS, "svg");
  wireSvg.setAttribute("viewBox", "0 0 100 100"); wireSvg.setAttribute("preserveAspectRatio", "none");
  wireSvg.style.cssText = "position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;";
  bg.appendChild(wireSvg);

  let wires = [];
  for (let h = 0; h < H_WIRES; h++) {
    let y = PADDING + (h / (H_WIRES - 1)) * (100 - 2 * PADDING);
    let sag = SAG * (0.7 + Math.random() * 0.6);
    wires.push({ y, sag });
    let p = document.createElementNS(svgNS, "path");
    p.setAttribute("d", `M ${PADDING} ${y} Q 50 ${y + sag} ${100 - PADDING} ${y}`);
    p.setAttribute("stroke", "rgba(255,255,255,0.10)"); p.setAttribute("stroke-width", "0.5"); p.setAttribute("fill", "none");
    wireSvg.appendChild(p);
  }

  let perWire = Math.ceil(allBulbs.length / H_WIRES), bulbIdx = 0;
  for (let w = 0; w < H_WIRES; w++) {
    let wire = wires[w], countHere = Math.min(perWire, allBulbs.length - bulbIdx);
    if (countHere <= 0) break;
    for (let k = 0; k < countHere; k++) {
      let b = allBulbs[bulbIdx++];
      let t = (k + 0.5) / countHere;
      let x = PADDING + t * (100 - 2 * PADDING);
      let sagOffset = wire.sag * 4 * t * (1 - t);
      let y = wire.y + sagOffset;

      let dot = document.createElement("div");
      dot.className = "mini-bulb"; dot.dataset.owner = b.name;
      dot.style.left = x + "%"; dot.style.top = y + "%";
      dot.style.backgroundColor = b.color; dot.style.boxShadow = `0 0 10px ${b.color}, 0 0 20px ${b.color}`;
      if (Math.random() < 0.3) { dot.style.animation = `twinkle ${1.5 + Math.random() * 1.5}s infinite alternate`; dot.style.animationDelay = `${Math.random() * 2}s`; }
      bg.appendChild(dot);
    }
  }

  let ranked = data.slice().sort((a,b) => b.bulbs - a.bulbs);
  let tiers = ranked.length <= 3 ? [ranked.slice(0,3)] : (ranked.length <= 7 ? [ranked.slice(0,3), ranked.slice(3)] : [ranked.slice(0,3), ranked.slice(3,7), ranked.slice(7)]);
  let tierY = [{min:15,max:33},{min:38,max:57},{min:62,max:84}];
  let maxB = Math.max(1, ...data.map(d => d.bulbs));

  tiers.forEach((group, tierIdx) => {
    if (!group.length) return;
    let yr = tierY[tierIdx] || tierY[2];
    group.forEach((m, i) => {
      let t = group.length === 1 ? 0.5 : i / (group.length - 1);
      let y = yr.min + t * (yr.max - yr.min);
      let hw = Math.max(0.5, (y - 8) * 0.42);
      let inner = hw * 0.85;
      let x = group.length === 1 ? 50 : 50 - inner + (i / (group.length - 1)) * (inner * 2);
      let size = 14 + (m.bulbs / maxB) * 12;
      let el = document.createElement("div");
      el.className = "tree-bulb"; el.dataset.owner = m.name;
      el.style.cssText = `left:${x}%;top:${y}%;width:${size}px;height:${size}px;background:${m.color};box-shadow:0 0 15px ${m.color},0 0 30px ${m.color};animation-delay:${Math.random() * 2}s;`;
      el.title = `${m.name} • ${m.bulbs} огоньков`;
      el.addEventListener("click", () => highlightMember(m.name, findCard(m.name)));
      sceneInner.appendChild(el);
    });
  });

  ranked.forEach(m => {
    let card = document.createElement("div");
    card.className = "member-card"; card.dataset.owner = m.name; card.style.borderTop = `4px solid ${m.color}`;
    card.addEventListener("click", () => highlightMember(m.name, card));
    let av = m.photo ? `<img src="${encodeURI(m.photo)}" class="avatar" style="border-color:${m.color}" alt="${m.name}" loading="lazy">` : `<div class="avatar" style="border-color:${m.color};color:${m.color}">${m.name.charAt(0).toUpperCase()}</div>`;
    card.innerHTML = `<div class="member-header">${av}<div class="member-info"><h3>${m.name}</h3><span class="habit-tag">🎯 ${m.habit}</span></div></div><div class="bulb-counter"><span class="color-dot" style="background:${m.color};box-shadow:0 0 6px ${m.color}"></span><span>Зажжено лампочек: ${m.bulbs}</span></div>${m.wish ? `<div class="wish-box">«${m.wish}»</div>` : ''}`;
    grid.appendChild(card);
  });

  document.getElementById("last-update").innerText = "Обновлено: " + new Date().toLocaleTimeString("ru-RU");
}

function findCard(name) { return document.querySelector(`.member-card[data-owner="${name}"]`) || document.querySelector(".member-card"); }

let lastDataHash = "", isLoading = false;
async function loadAndRender() {
  if (isLoading) return; isLoading = true;
  if (!lastDataHash) { let c = loadCache(); if (c && c.length) { document.getElementById("loading").style.display = "none"; draw(c); lastDataHash = JSON.stringify(c); } }
  try {
    let txt = await fetchSheetText(), rows = parseCSV(txt), data = [];
    for (let i = 1; i < rows.length; i++) {
      let r = rows[i];
      if (r && r[0]) data.push({ name: r[0], color: (r[1] && r[1].startsWith("#")) ? r[1] : "#ffd166", bulbs: parseInt(r[2], 10) || 0, habit: r[3] || "Полезная привычка", photo: r[4] || "", wish: r[5] || "" });
    }
    let h = JSON.stringify(data);
    if (h !== lastDataHash) { lastDataHash = h; saveCache(data); document.getElementById("loading").style.display = "none"; draw(data); }
  } catch (e) {
    if (!lastDataHash) { document.getElementById("loading").style.display = "block"; document.getElementById("loading").innerText = "😔 Не удалось зажечь огоньки. Попробуйте обновить страницу."; }
  } finally { isLoading = false; }
}

let refreshTimer = null;
function startAutoRefresh() { if (!refreshTimer) refreshTimer = setInterval(loadAndRender, 600000); }
function stopAutoRefresh() { if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; } }

document.getElementById("reset-filter").addEventListener("click", resetHighlight);
loadAndRender(); startAutoRefresh();
document.addEventListener("visibilitychange", () => { if (document.hidden) stopAutoRefresh(); else { loadAndRender(); startAutoRefresh(); } });

/* ==========================================
   НОВОГОДНИЙ ЭФФЕКТ (Шампанское, Салют, Гирлянда)
   ========================================== */
document.getElementById("ny-btn").addEventListener("click", function() {
  // 1. Включаем режим Нового года (перекрашивает и трясет гирлянду)
  document.body.classList.add("new-year-mode");
  this.style.display = "none"; // Прячем кнопку

  // 2. Запускаем салют
  launchFireworks();

  // 3. Запускаем пену из шампанского
  startFoam();
  
  // Через 15 секунд выключаем безумие гирлянды (чтобы не перегружать браузер)
  setTimeout(() => {
    document.body.classList.remove("new-year-mode");
    this.style.display = "inline-flex";
    this.innerText = "🎆 Ещё раз! 🍾";
  }, 15000);
});

function launchFireworks() {
  const container = document.querySelector(".tree-section");
  const colors = ["#ff0000", "#00ff00", "#0000ff", "#ffff00", "#ff00ff", "#00ffff", "#ffd166"];
  
  let count = 0;
  let interval = setInterval(() => {
    if (count > 20) { clearInterval(interval); return; }
    
    for (let i = 0; i < 30; i++) {
      let p = document.createElement("div");
      p.className = "firework";
      let color = colors[Math.floor(Math.random() * colors.length)];
      p.style.backgroundColor = color;
      p.style.boxShadow = `0 0 10px ${color}`;
      
      // Начальная точка (над елкой)
      let startX = 50 + (Math.random() - 0.5) * 40; // 30-70%
      let startY = 20 + Math.random() * 20; // 20-40%
      
      p.style.left = startX + "%";
      p.style.top = startY + "%";
      container.appendChild(p);
      
      // Анимация разлета
      let angle = Math.random() * Math.PI * 2;
      let velocity = 50 + Math.random() * 100;
      let tx = Math.cos(angle) * velocity;
      let ty = Math.sin(angle) * velocity;
      
      p.animate([
        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
      ], {
        duration: 1000 + Math.random() * 1000,
        easing: 'cubic-bezier(0, .9, .57, 1)'
      });
      
      setTimeout(() => p.remove(), 2000);
    }
    count++;
  }, 300); // Каждые 0.3 сек новый залп
}

function startFoam() {
  const champagne = document.getElementById("champagne");
  const container = document.querySelector(".tree-section");
  
  // Находим координаты горлышка бутылки относительно контейнера
  const rect = champagne.getBoundingClientRect();
  const containerRect = container.getBoundingClientRect();
  
  const startX = rect.left + rect.width / 2 - containerRect.left;
  const startY = rect.top - containerRect.top - 50; // Высота горлышка

  let interval = setInterval(() => {
    for (let i = 0; i < 5; i++) {
      let p = document.createElement("div");
      p.className = "foam-particle";
      p.style.left = startX + "px";
      p.style.top = startY + "px";
      container.appendChild(p);
      
      let tx = (Math.random() - 0.5) * 200; // Разлет в стороны
      let ty = -100 - Math.random() * 200;  // Вверх
      
      p.animate([
        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
      ], {
        duration: 1500 + Math.random() * 1000,
        easing: 'ease-out'
      });
      
      setTimeout(() => p.remove(), 2500);
    }
  }, 50);

  // Останавливаем пену через 8 секунд
  setTimeout(() => clearInterval(interval), 8000);
}
</script>
