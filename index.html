<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зажигаем гирлянду 2027</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:radial-gradient(circle at top,#1b2845 0%,#090d16 100%);color:#f8f9fa;min-height:100vh;padding:20px}
.container{max-width:1000px;margin:0 auto;text-align:center}
h1{font-size:2.2rem;margin-bottom:5px;color:#ffd166;text-shadow:0 0 15px rgba(255,209,102,.4)}
.subtitle{color:#a9bcd0;margin-bottom:30px;font-size:1.1rem}

.tree-section{background:rgba(28,37,65,.6);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:30px 20px;margin-bottom:30px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tree-scene-wrap{width:100%;max-width:680px;margin:0 auto}
.tree-scene{position:relative;width:100%;padding-bottom:131.25%}
.tree-scene-inner{position:absolute;top:0;left:0;right:0;bottom:0}

.bg-garland{position:absolute;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;overflow:visible}
.tree-svg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}

.mini-bulb{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);transition:transform .3s,opacity .3s;cursor:pointer;z-index:0;pointer-events:auto}
.mini-bulb.dimmed{opacity:.08!important;animation:none!important}
.mini-bulb.highlighted{transform:translate(-50%,-50%) scale(1.8);z-index:3}

.tree-bulb{position:absolute;border-radius:50%;transform:translate(-50%,-50%);transition:transform .3s,box-shadow .3s;cursor:pointer;z-index:2;animation:twinkle 2.5s infinite alternate}
.tree-bulb.dimmed{opacity:.25!important;animation:none}
.tree-bulb.highlighted{transform:translate(-50%,-50%) scale(1.35);z-index:5}
@keyframes twinkle{0%{opacity:.85;filter:brightness(1)}100%{opacity:1;filter:brightness(1.5)}}

.stats-bar{display:flex;justify-content:center;gap:20px;margin-top:25px;flex-wrap:wrap}
.stat-box{
  flex:1 1 160px; max-width:220px; background:rgba(11,19,43,.7);
  padding:15px 10px; border-radius:12px; border:1px solid rgba(255,209,102,.3);
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:4px;
}
.stat-number{font-size:1.8rem;font-weight:bold;color:#ffd166;line-height:1.1}
.stat-label{font-size:0.9rem;color:#a9bcd0;line-height:1.2}

.filter-hint{margin-top:20px;font-size:.9rem;color:#a9bcd0}
.reset-btn{display:none;margin:12px auto 0;background:#ffd166;color:#0b132b;border:none;padding:8px 18px;border-radius:20px;font-weight:bold;cursor:pointer;font-size:.9rem}

.section-title{font-size:1.6rem;margin:40px 0 20px;color:#fff}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;text-align:left}
.member-card{background:#1c2541;border-radius:16px;padding:20px;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:12px;transition:transform .2s;cursor:pointer}
.member-card:hover{transform:translateY(-4px)}
.member-card.active{outline:2px solid #ffd166;background:#243154}
.member-header{display:flex;align-items:center;gap:15px}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff;flex-shrink:0;background:#2b3a67;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:bold}
.member-info h3{margin:0 0 4px 0;font-size:1.15rem}
.habit-tag{font-size:.85rem;color:#a9bcd0;display:block}
.bulb-counter{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);padding:6px 12px;border-radius:20px;font-weight:bold;font-size:.95rem;width:fit-content}
.color-dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.wish-box{background:rgba(255,255,255,.05);padding:12px;border-radius:10px;font-size:.92rem;line-height:1.4;color:#e0e6ed;font-style:italic;margin-top:auto}
#loading{color:#ffd166;font-size:1.1rem;margin:20px 0}
#last-update{font-size:.8rem;color:#a9bcd0;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h1>🎄 Зажигаем гирлянду 2027</h1>
<!-- Обновленная дата здесь: -->
<p class="subtitle">Новогодний марафон полезных привычек • 30 ноября – 27 декабря 2026</p>
<div id="loading">✨ Зажигаем огоньки...</div>

<div class="tree-section">
  <div class="tree-scene-wrap">
    <div class="tree-scene" id="tree-scene">
      <div class="tree-scene-inner" id="tree-scene-inner">
        <div class="bg-garland" id="bg-garland"></div>
        <svg class="tree-svg" viewBox="0 0 300 380" preserveAspectRatio="xMidYMid meet">
          <rect x="132" y="330" width="36" height="40" rx="4" fill="#5c4033"/>
          <polygon points="150,30 60,150 240,150" fill="#1b4332"/>
          <polygon points="150,95 40,240 260,240" fill="#2d6a4f"/>
          <polygon points="150,170 20,335 280,335" fill="#40916c"/>
          <polygon points="150,5 156,22 174,22 160,33 165,50 150,40 135,50 140,33 126,22 144,22" fill="#ffd166"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="stats-bar">
    <div class="stat-box">
      <div class="stat-number" id="total-bulbs">0</div>
      <div class="stat-label">Огоньков зажжено</div>
    </div>
    <div class="stat-box">
      <div class="stat-number" id="team-count">0</div>
      <div class="stat-label">Хранителей энергии</div>
    </div>
  </div>
  <div class="filter-hint">💡 Нажмите на карточку участника — вспыхнут его огоньки на фоне и его лампочка на ёлке</div>
  <button class="reset-btn" id="reset-filter">Показать все огоньки</button>
  <div id="last-update"></div>
</div>

<h2 class="section-title">✨ Наша команда и пожелания на 2027 год</h2>
<div class="team-grid" id="team-grid"></div>
</div>

<script>
var SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTfp0jmMKiuE_XFKHdUrxG1N7USmCxr4B5B7nAFdAHF7H0FK6K-mixB0tr59PvaSrJ2q8oAH9KhwxsF/pub?gid=6257065&single=true&output=csv";
var CACHE_KEY = "garland_data_v5"; // Версия кэша

function parseCSV(text) {
  var rows = [], row = [], cell = "", inQuotes = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text.charAt(i);
    if (inQuotes) {
      if (ch === '"') {
        if (text.charAt(i + 1) === '"') { cell += '"'; i++; }
        else { inQuotes = false; }
      } else { cell += ch; }
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(cell.trim()); cell = ""; }
      else if (ch === '\n') { row.push(cell.trim()); rows.push(row); row = []; cell = ""; }
      else if (ch !== '\r') cell += ch;
    }
  }
  if (cell.length > 0 || row.length > 0) { row.push(cell.trim()); rows.push(row); }
  return rows;
}

async function fetchSheetText() {
  var enc = encodeURIComponent(SHEET_URL);
  var sources = [
    SHEET_URL,
    "https://api.allorigins.win/raw?url=" + enc,
    "https://api.codetabs.com/v1/proxy?quest=" + enc
  ];
  function tryFetch(url) {
    return new Promise(function(resolve, reject) {
      var ctrl = new AbortController();
      var timer = setTimeout(function(){ ctrl.abort(); }, 10000);
      fetch(url, { signal: ctrl.signal, cache: "no-store", mode: "cors" })
        .then(function(res){
          clearTimeout(timer);
          if (!res.ok) return reject(new Error("http " + res.status));
          return res.text();
        })
        .then(function(txt){
          if (!txt) return reject(new Error("empty"));
          txt = txt.replace(/^\uFEFF/, "");
          if (txt.indexOf("Имя") === -1) return reject(new Error("no header"));
          resolve(txt);
        })
        .catch(function(e){ clearTimeout(timer); reject(e); });
    });
  }
  return new Promise(function(resolve, reject) {
    var done = false, errors = 0;
    sources.forEach(function(url){
      tryFetch(url).then(function(txt){
        if (done) return;
        done = true; resolve(txt);
      }).catch(function(){
        errors++;
        if (errors === sources.length && !done) reject(new Error("Не удалось связаться с таблицей"));
      });
    });
  });
}

function saveCache(data) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch(e) {} }
function loadCache() { try { var s = localStorage.getItem(CACHE_KEY); return s ? JSON.parse(s) : null; } catch(e) { return null; } }

function highlightMember(name, el) {
  document.querySelectorAll(".member-card").forEach(function(c){ c.classList.remove("active"); });
  if (el) el.classList.add("active");
  document.querySelectorAll(".mini-bulb").forEach(function(b){
    if (b.dataset.owner === name) { b.classList.remove("dimmed"); b.classList.add("highlighted"); }
    else { b.classList.add("dimmed"); b.classList.remove("highlighted"); }
  });
  document.querySelectorAll(".tree-bulb").forEach(function(b){
    if (b.dataset.owner === name) { b.classList.remove("dimmed"); b.classList.add("highlighted"); }
    else { b.classList.add("dimmed"); b.classList.remove("highlighted"); }
  });
  document.getElementById("reset-filter").style.display = "inline-block";
}
function resetHighlight() {
  document.querySelectorAll(".member-card").forEach(function(c){ c.classList.remove("active"); });
  document.querySelectorAll(".mini-bulb").forEach(function(b){ b.classList.remove("dimmed","highlighted"); });
  document.querySelectorAll(".tree-bulb").forEach(function(b){ b.classList.remove("dimmed","highlighted"); });
  document.getElementById("reset-filter").style.display = "none";
}

function draw(data) {
  var sceneInner = document.getElementById("tree-scene-inner");
  var bg = document.getElementById("bg-garland");
  var grid = document.getElementById("team-grid");

  bg.innerHTML = "";
  var oldTreeBulbs = sceneInner.querySelectorAll(".tree-bulb");
  for (var i = 0; i < oldTreeBulbs.length; i++) { oldTreeBulbs[i].remove(); }
  grid.innerHTML = "";
  resetHighlight();

  // ФИЛЬТРУЕМ УЧАСТНИКОВ: оставляем только тех, у кого есть хотя бы 1 огонёк
  var activeData = [];
  data.forEach(function(m) {
    if (m.bulbs > 0) activeData.push(m);
  });

  // Счётчик хранителей показывает только активных участников
  document.getElementById("team-count").innerText = activeData.length;
  
  var totalBulbs = 0;
  activeData.forEach(function(m){ totalBulbs += m.bulbs; });
  document.getElementById("total-bulbs").innerText = totalBulbs;

  // Считаем, сколько огоньков должно быть на сетке (у всех, кроме первого)
  var garlandBulbsCount = 0;
  activeData.forEach(function(m) {
    if (m.bulbs > 1) garlandBulbsCount += (m.bulbs - 1);
  });

  /* --- ОТРИСОВКА СЕТКИ --- */
  if (garlandBulbsCount > 0) {
    var allBulbsForGarland = [];
    activeData.forEach(function(m){
      if (m.bulbs > 1) {
        for (var j = 1; j < m.bulbs; j++) {
          allBulbsForGarland.push({ name: m.name, color: m.color });
        }
      }
    });
    allBulbsForGarland.sort(function(){ return Math.random() - 0.5; });

    var H_WIRES = 20;
    var PADDING = 2;
    var SAG = 2.0;

    var svgNS = "http://www.w3.org/2000/svg";
    var wireSvg = document.createElementNS(svgNS, "svg");
    wireSvg.setAttribute("viewBox", "0 0 100 100");
    wireSvg.setAttribute("preserveAspectRatio", "none");
    wireSvg.style.position = "absolute";
    wireSvg.style.top = "0"; wireSvg.style.left = "0";
    wireSvg.style.width = "100%"; wireSvg.style.height = "100%";
    wireSvg.style.overflow = "visible";
    bg.appendChild(wireSvg);

    var wires = [];
    for (var h = 0; h < H_WIRES; h++) {
      var y = PADDING + (h / (H_WIRES - 1)) * (100 - 2 * PADDING);
      var sag = SAG * (0.7 + Math.random() * 0.6);
      wires.push({ y: y, sag: sag });

      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", "M " + PADDING + " " + y + " Q 50 " + (y + sag) + " " + (100 - PADDING) + " " + y);
      p.setAttribute("stroke", "rgba(255,255,255,0.10)");
      p.setAttribute("stroke-width", "0.5");
      p.setAttribute("fill", "none");
      p.setAttribute("vector-effect", "non-scaling-stroke");
      wireSvg.appendChild(p);
    }

    var perWire = Math.ceil(allBulbsForGarland.length / H_WIRES);
    var bulbIdx = 0;

    for (var w = 0; w < H_WIRES; w++) {
      var wire = wires[w];
      var countHere = Math.min(perWire, allBulbsForGarland.length - bulbIdx);
      if (countHere <= 0) break;

      for (var k = 0; k < countHere; k++) {
        var b = allBulbsForGarland[bulbIdx++];
        var t = (k + 0.5) / countHere;
        var x = PADDING + t * (100 - 2 * PADDING);
        var sagOffset = wire.sag * 4 * t * (1 - t);
        var y = wire.y + sagOffset;

        var dot = document.createElement("div");
        dot.className = "mini-bulb";
        dot.dataset.owner = b.name;
        dot.style.left = x + "%"; dot.style.top = y + "%";
        dot.style.backgroundColor = b.color;
        dot.style.boxShadow = "0 0 10px " + b.color + ", 0 0 20px " + b.color;
        
        if (Math.random() < 0.3) {
          dot.style.animation = "twinkle " + (1.5 + Math.random() * 1.5) + "s infinite alternate";
          dot.style.animationDelay = (Math.random() * 2) + "s";
        }
        bg.appendChild(dot);
      }
    }
  }

  /* --- ОТРИСОВКА ЁЛКИ --- */
  var ranked = activeData.slice().sort(function(a,b){ return b.bulbs - a.bulbs; });
  
  if (ranked.length > 0) {
    var tiers;
    if (ranked.length <= 3) tiers = [ranked.slice(0,3)];
    else if (ranked.length <= 7) tiers = [ranked.slice(0,3), ranked.slice(3)];
    else tiers = [ranked.slice(0,3), ranked.slice(3,7), ranked.slice(7)];

    var tierY = [{min:15,max:33},{min:38,max:57},{min:62,max:84}];
    function halfWidthAt(y) { return Math.max(0.5, (y - 8) * 0.42); }
    var maxB = 1;
    activeData.forEach(function(d){ if (d.bulbs > maxB) maxB = d.bulbs; });

    tiers.forEach(function(group, tierIdx) {
      if (!group.length) return;
      var yr = tierY[tierIdx] || tierY[2];
      group.forEach(function(m, i) {
        
        var t = group.length === 1 ? 0.5 : i / (group.length - 1);
        var y = yr.min + t * (yr.max - yr.min);
        var hw = halfWidthAt(y);
        var inner = hw * 0.85;
        var x;
        if (group.length === 1) x = 50;
        else x = 50 - inner + (i / (group.length - 1)) * (inner * 2);
        
        var ratio = maxB > 0 ? m.bulbs / maxB : 0;
        var size = 14 + ratio * 12;
        
        var el = document.createElement("div");
        el.className = "tree-bulb";
        el.dataset.owner = m.name;
        el.style.left = x + "%"; el.style.top = y + "%";
        el.style.width = size + "px"; el.style.height = size + "px";
        el.style.background = m.color;
        el.style.boxShadow = "0 0 15px " + m.color + ", 0 0 30px " + m.color;
        el.title = m.name + " • " + m.bulbs + " огоньков";
        el.style.animationDelay = (Math.random() * 2) + "s";
        el.addEventListener("click", function(){ highlightMember(m.name, findCard(m.name)); });
        sceneInner.appendChild(el);
      });
    });
  }

  /* --- КАРТОЧКИ --- */
  ranked.forEach(function (m) {
    var card = document.createElement("div");
    card.className = "member-card";
    card.dataset.owner = m.name;
    card.style.borderTop = "4px solid " + m.color;
    card.addEventListener("click", function () { highlightMember(m.name, card); });
    var avatarHtml = m.photo
      ? '<img src="' + encodeURI(m.photo) + '" class="avatar" style="border-color:' + m.color + '" alt="' + m.name + '" loading="lazy">'
      : '<div class="avatar" style="border-color:' + m.color + ';color:' + m.color + '">' + m.name.charAt(0).toUpperCase() + '</div>';
    var wishHtml = m.wish ? '<div class="wish-box">«' + m.wish + '»</div>' : '';
    card.innerHTML =
      '<div class="member-header">' + avatarHtml +
        '<div class="member-info"><h3>' + m.name + '</h3>' +
        '<span class="habit-tag">🎯 ' + m.habit + '</span></div></div>' +
      '<div class="bulb-counter">' +
        '<span class="color-dot" style="background:' + m.color + ';box-shadow:0 0 6px ' + m.color + '"></span>' +
        '<span>Зажжено лампочек: ' + m.bulbs + '</span></div>' +
      wishHtml;
    grid.appendChild(card);
  });

  document.getElementById("last-update").innerText = "Обновлено: " + new Date().toLocaleTimeString("ru-RU");
}

function findCard(name) {
  var cards = document.querySelectorAll(".member-card");
  for (var i = 0; i < cards.length; i++) {
    if (cards[i].dataset.owner === name) return cards[i];
  }
  return cards[0];
}

var lastDataHash = "";
var isLoading = false;

async function loadAndRender() {
  if (isLoading) return;
  isLoading = true;

  if (!lastDataHash) {
    var cached = loadCache();
    if (cached && cached.length) {
      document.getElementById("loading").style.display = "none";
      draw(cached);
      lastDataHash = JSON.stringify(cached);
    }
  }

  try {
    var txt = await fetchSheetText();
    var rows = parseCSV(txt);
    var data = [];
    for (var i = 1; i < rows.length; i++) {
      var row = rows[i];
      if (row && row[0]) {
        data.push({
          name: row[0],
          color: (row[1] && row[1].startsWith("#")) ? row[1] : "#ffd166",
          bulbs: parseInt(row[2], 10) || 0,
          habit: row[3] || "Полезная привычка",
          photo: row[4] || "",
          wish: row[5] || ""
        });
      }
    }
    var h = JSON.stringify(data);
    if (h !== lastDataHash) {
      lastDataHash = h;
      saveCache(data);
      document.getElementById("loading").style.display = "none";
      draw(data);
    }
  } catch (e) {
    if (!lastDataHash) {
      document.getElementById("loading").style.display = "block";
      document.getElementById("loading").innerText = "😔 Не удалось зажечь огоньки. Попробуйте обновить страницу.";
    }
  } finally {
    isLoading = false;
  }
}

var refreshTimer = null;
function startAutoRefresh() { if (!refreshTimer) refreshTimer = setInterval(loadAndRender, 600000); }
function stopAutoRefresh() { if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; } }

document.getElementById("reset-filter").addEventListener("click", resetHighlight);
loadAndRender();
startAutoRefresh();

document.addEventListener("visibilitychange", function () {
  if (document.hidden) stopAutoRefresh();
  else { loadAndRender(); startAutoRefresh(); }
});
</script>
</body>
</html>
